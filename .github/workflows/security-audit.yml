name: Security Audit

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 3 * * 1"

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.project }}
      - name: Run audit
        # Production deps only — build-tool chain (Tailwind/ESLint) may lag CVE patches.
        run: npm run audit
        working-directory: ${{ matrix.project }}
