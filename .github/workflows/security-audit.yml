name: Security Audit

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 3 * * 1"

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.project }}
      - name: Run audit
        run: npm audit --audit-level=high
        working-directory: ${{ matrix.project }}
