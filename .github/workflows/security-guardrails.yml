name: Security Guardrails

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  enforce-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install npm dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run npm security checks
        run: npm run security:check

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pip-audit

      - name: Run backend security lint
        run: python backend/scripts/security_lint.py

      - name: Run Python dependency audit
        run: python -m pip_audit -r backend/requirements.txt

      - name: Validate backend imports/syntax
        run: python -m compileall backend/app
