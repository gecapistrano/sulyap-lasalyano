<script>
(function(){
  try{ localStorage.removeItem('pm-theme'); }catch(e){}
  document.documentElement.setAttribute('data-theme', 'dark');
})();
/* Catalog API for the live KG (same public GET Browse/Scan use).
   Override: /knowledge-graph?api=http://127.0.0.1:8000
   Empty apiBaseUrl → same-origin /catalog (serve.mjs proxies locally).
   If the API is unreachable, 15-kg-graph.js falls back to /public/data/graph.json. */
(function () {
  var params = new URLSearchParams(location.search);
  var api = (params.get('api') || '').trim();
  window.SL_KG_CONFIG = { apiBaseUrl: api };
})();
</script>
<script>
(function(){
  try{
    if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var path = location.pathname;
    var kind = /\/scan(\.html)?$/.test(path) ? 'scan'
      : /\/knowledge-graph(\.html)?$/.test(path) ? 'kg'
      : /\/president(\.html)?$/.test(path) ? 'president'
      : 'home';
    if(kind === 'kg'){
      sessionStorage.removeItem('sl_page_tx');
      return;
    }
    if(sessionStorage.getItem('sl_page_tx') !== kind) return;
    document.documentElement.classList.add('page-tx-from');
    window.__pageTxSafety = setTimeout(function(){
      document.documentElement.classList.remove('page-tx-from');
    }, 2200);
  }catch(e){}
})();
</script>
