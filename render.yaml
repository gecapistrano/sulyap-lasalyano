# Render Blueprint — FastAPI API for Sulyap Lasalyano
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: sulyap-lasalyano-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_BASE
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: catalog-photos
      - key: CATALOG_OMIT_STORAGE_MODELS
        value: "true"
      - key: PUBLIC_MODEL_BASE_URL
        sync: false
      - key: SYNC_REMOTE_DATABASE_URL
        sync: false
      - key: CATALOG_SYNC_ON_START
        value: "0"
