<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Scan — Sulyap Lasalyano</title>
<meta name="description" content="Point your camera at Presidents’ Memorabilia artifacts for real-time recognition.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=11">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=11">
<meta name="theme-color" content="#0a140f">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Instrument+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script>
(function(){
  try{
    localStorage.removeItem('pm-theme');
    localStorage.removeItem('sl_scan_dark');
  }catch(e){}
  document.documentElement.setAttribute('data-theme', 'dark');
})();
/* Optional: point catalog lookups at the FastAPI host (https only, or localhost).
   Leave empty for on-device detection with RD-code fallbacks.
   Override without editing: /scan.html?api=http://127.0.0.1:8000 */
(function () {
  var params = new URLSearchParams(location.search);
  var api = (params.get('api') || '').trim();
  window.SL_SCAN_CONFIG = {
    apiBaseUrl: api,
    modelAssetBaseUrl: (params.get('models') || '').trim(),
    wasmPaths: (params.get('wasm') || '').trim()
  };
})();
</script>
<link rel="stylesheet" href="/styles/01-tokens.css?v=18">
<link rel="stylesheet" href="/styles/11-scan.css?v=9">
<script defer src="/scripts/02-i18n.js?v=92"></script>
<script defer src="/scripts/09-a11y.js?v=3"></script>
<!-- Absolute /vendor + /scripts so /scan and /scan.html resolve the same (not relative to path). -->
<script src="/vendor/onnxruntime-web/ort.wasm.min.js?v=48"></script>
<script type="module" src="/scripts/13-scan.js?v=8"></script>
<script>
/* Back: same-origin history when possible, else home.
   sl_home_ready skips splash; home still plays in-anim on return / bfcache. */
(function(){
  var FALLBACK = 'index.html';
  function goBack(){
    try{ sessionStorage.setItem('sl_home_ready', '1'); }catch(e){}
    try{
      if(window.history.length > 1 && document.referrer){
        var sameOrigin = false;
        try{ sameOrigin = new URL(document.referrer).origin === location.origin; }catch(e){}
        if(sameOrigin){
          history.back();
          return;
        }
      }
    }catch(e){}
    location.href = FALLBACK;
  }
  document.addEventListener('DOMContentLoaded', function(){
    var btn = document.getElementById('scanBackHome');
    if(!btn) return;
    btn.addEventListener('click', function(e){
      e.preventDefault();
      goBack();
    });
  });
})();
</script>
</head>
<body class="scan-page">
<a class="skiplink" href="#liveScan" data-i="skip">Skip to content</a>

<div id="liveScan" class="scan-shell" role="main">
  <video id="scanVideo" class="scan-video" playsinline muted autoplay aria-hidden="true"></video>
  <canvas id="scanDust" class="scan-dust" aria-hidden="true"></canvas>
  <div class="scan-atmosphere" aria-hidden="true"></div>

  <header class="scan-chrome">
    <button type="button" class="scan-back" id="scanBackHome" data-i-label="scan.backHome" aria-label="Back to home">← Back</button>
    <h1 class="scan-title"><span class="scan-title-brand">Sulyap Lasalyano</span> <span class="scan-title-rest" data-i="scan.title">Live Scan</span></h1>
    <div class="lang-dd scan-lang" data-lang-dd>
      <button type="button" class="lang lang-dd-btn scan-lang-btn" aria-expanded="false" aria-haspopup="listbox" aria-controls="lang-menu-scan" data-i-label="lang">
        <span class="lang-dd-val">EN</span>
      </button>
      <ul class="lang-dd-menu scan-lang-menu" id="lang-menu-scan" role="listbox" hidden>
        <li role="option" data-value="en" aria-selected="true">English</li>
        <li role="option" data-value="fil" aria-selected="false">Filipino</li>
        <li role="option" data-value="es" aria-selected="false">Spanish</li>
        <li role="option" data-value="fr" aria-selected="false">French</li>
        <li role="option" data-value="zh" aria-selected="false">Chinese</li>
        <li role="option" data-value="ko" aria-selected="false">Korean</li>
        <li role="option" data-value="ja" aria-selected="false">Japanese</li>
      </ul>
    </div>
  </header>

  <div id="scanViewport" class="scan-viewport">
    <div id="scanZoomLayer" class="scan-zoom-layer" aria-hidden="true"></div>
    <div id="scanOverlay" class="scan-overlay" aria-live="polite"></div>
    <span id="scanZoomIndicator" class="scan-zoom-indicator" hidden aria-live="polite">1.0×</span>
    <p id="scanFrameHint" class="scan-frame-hint" data-i="scan.point">Point at memorabilia — tap an outline for details</p>

    <div id="scanPermission" class="scan-permission" role="status" aria-live="polite">
      <div id="scanPermTitle" class="scan-permission__title" data-i="scan.enableTitle">Enable camera</div>
      <div id="scanPermSub" class="scan-permission__sub" data-i="scan.enableHint">Allow camera access to start Live Scan.</div>
      <button type="button" id="scanPermBtn" class="scan-permission__btn" data-i="scan.enableBtn">Enable Camera</button>
    </div>
  </div>

  <div class="scan-status" aria-live="polite">
    <p id="scanTip" class="scan-tip"></p>
    <p id="scanModelStatus" class="scan-model-status" data-i="scan.loadingModel">Loading model…</p>
  </div>

  <div id="scanDetectBar" class="scan-detect-bar" hidden>
    <span id="scanDetectLabel" class="scan-detect-label"></span>
    <button type="button" id="scanExitBtn" class="scan-exit" data-i-label="scan.exit" aria-label="Close details">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <div id="scanInfoBackdrop" class="scan-backdrop" hidden></div>
  <div id="scanInfoSheet" class="scan-info" hidden>
    <div class="scan-sheet" role="dialog" aria-modal="true" aria-labelledby="scanInfoName">
      <div class="scan-sheet__handle">
        <div class="scan-sheet__handle-bar" aria-hidden="true"></div>
      </div>
      <div class="scan-sheet__header">
        <div id="scanInfoPresident" class="scan-sheet__president"></div>
        <h2 id="scanInfoName" class="scan-sheet__name"></h2>
        <div id="scanInfoYear" class="scan-sheet__year"></div>
      </div>
      <div class="scan-sheet__body">
        <p id="scanInfoDesc" class="scan-sheet__desc"></p>
        <section id="scanHistorySection">
          <h3 class="scan-sheet__history-title" data-i="scan.historical">Historical Context</h3>
          <p id="scanInfoHistory" class="scan-sheet__history"></p>
        </section>
      </div>
    </div>
  </div>
</div>
</body>
</html>
